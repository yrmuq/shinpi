name: Rust and AppImage environment
description: Install host libraries, Rust checks and a Cargo cache.
inputs:
  cache:
    description: Cache namespace
    required: true
  flatpak:
    description: Optional Flatpak cache channel
    default: ''
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      id: rust
      with:
        components: rustfmt, clippy
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
          packaging/appimage/build/cache
        key: shinpi-${{ inputs.cache }}-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          shinpi-${{ inputs.cache }}-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-
          shinpi-${{ inputs.cache }}-v2-${{ runner.os }}-${{ runner.arch }}-
          shinpi-${{ inputs.cache }}-${{ runner.os }}-${{ runner.arch }}-
    - name: Build distribution tools
      shell: bash
      run: cargo build --locked --package shinpi-tools
    - uses: actions/cache@v6
      if: inputs.flatpak != ''
      with:
        path: |
          ~/.local/share/flatpak
          ~/.cache/flatpak
          .flatpak-builder
        key: shinpi-flatpak-${{ inputs.flatpak }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'packaging/flatpak/*.json') }}
        restore-keys: |
          shinpi-flatpak-${{ inputs.flatpak }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-
    - name: Libraries
      shell: bash
      run: |
        # Keep Ubuntu signature verification; use a mirror with independent DNS.
        sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) -exec sed -i -E \
          -e 's@mirror\+file:/etc/apt/apt(-security)?-mirrors.txt@https://mirror.math.princeton.edu/pub/ubuntu@g' \
          -e 's@https?://(azure.archive|archive|security).ubuntu.com/ubuntu/?@https://mirror.math.princeton.edu/pub/ubuntu/@g' {} +
        sudo apt-get update
        sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev file dbus-daemon desktop-file-utils zsync flatpak flatpak-builder gnupg ostree
