name: Rust and AppImage environment
description: Install host libraries, Rust checks and a Cargo cache.
inputs:
  cache:
    description: Cache namespace
    required: true
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      id: rust
      with:
        components: rustfmt, clippy
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
          packaging/appimage/build/cache
        key: shinpi-${{ inputs.cache }}-v2-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          shinpi-${{ inputs.cache }}-v2-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-
          shinpi-${{ inputs.cache }}-v2-${{ runner.os }}-
          shinpi-${{ inputs.cache }}-${{ runner.os }}-
    - name: Libraries
      shell: bash
      run: |
        # Keep Ubuntu signature verification; use a mirror with independent DNS.
        sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) -exec sed -i -E \
          -e 's@mirror\+file:/etc/apt/apt(-security)?-mirrors.txt@https://mirror.math.princeton.edu/pub/ubuntu@g' \
          -e 's@https?://(azure.archive|archive|security).ubuntu.com/ubuntu/?@https://mirror.math.princeton.edu/pub/ubuntu/@g' {} +
        sudo apt-get update
        sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev file dbus-daemon
