name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare release from a dev merge
        id: prepare
        run: python3 packaging/release/flow.py prepare release
      - uses: ./.github/actions/setup
        if: steps.prepare.outputs.ready == 'true'
        with:
          cache: appimage
      - name: Check source
        if: steps.prepare.outputs.ready == 'true'
        run: sh packaging/check.sh
      - name: Build and check AppImage
        if: steps.prepare.outputs.ready == 'true'
        run: |
          sh packaging/appimage/build.sh
          sh packaging/appimage/check.sh
      - name: Publish release
        if: steps.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: python3 packaging/release/flow.py publish release "$VERSION"
      - name: Sync released version into dev and rebuild draft
        if: steps.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 packaging/release/flow.py sync-dev
