name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare release from a dev merge
        id: prepare
        run: python3 packaging/release/flow.py prepare release
      - uses: ./.github/actions/setup
        if: steps.prepare.outputs.ready == 'true'
        with:
          cache: appimage
      - name: Check source
        if: steps.prepare.outputs.ready == 'true'
        run: sh packaging/check.sh
      - name: Import signing key and retain the stable repository
        if: steps.prepare.outputs.ready == 'true'
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: sh packaging/flatpak/prepare.sh
      - name: Build and check distribution packages
        if: steps.prepare.outputs.ready == 'true'
        run: |
          sh packaging/release/build.sh stable
      - name: Sign and validate the Flatpak repository
        if: steps.prepare.outputs.ready == 'true'
        run: |
          sh packaging/flatpak/publish.sh
          sh packaging/flatpak/check.sh
      - uses: actions/configure-pages@v5
        if: steps.prepare.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.prepare.outputs.ready == 'true'
        with:
          path: flatpak-repo
      - uses: actions/deploy-pages@v4
        id: pages
        if: steps.prepare.outputs.ready == 'true'
      - name: Verify the deployed update repository
        if: steps.prepare.outputs.ready == 'true'
        run: |
          for file in summary summary.sig shinpi.gpg; do
            curl --fail --location --retry 10 --retry-all-errors --retry-delay 5 \
              "https://yrmuq.github.io/shinpi/$file" -o "$RUNNER_TEMP/$file"
            cmp "flatpak-repo/$file" "$RUNNER_TEMP/$file"
          done
      - name: Publish release
        if: steps.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: python3 packaging/release/flow.py publish release "$VERSION"
      - name: Sync released version into dev and rebuild draft
        if: steps.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 packaging/release/flow.py sync-dev
