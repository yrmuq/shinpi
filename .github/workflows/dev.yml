name: Development build

on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  appimage:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: development-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache: appimage
      - run: sh packaging/check.sh
      - run: sh packaging/appimage/build.sh
      - run: sh packaging/appimage/check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: development-appimage
          path: |
            dist/shinpi-x86_64.AppImage
            dist/shinpi-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: appimage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: development-draft
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: development-appimage
          path: dist
      - name: Update draft for the current dev commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 packaging/appimage/draft.py
