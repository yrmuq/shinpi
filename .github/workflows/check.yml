name: Check

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libwayland-dev libxkbcommon-dev dbus-daemon
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: node --test tests/placement.mjs
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: sh -n packaging/appimage/build.sh packaging/appimage/AppRun
      - run: cargo run --locked -- --once
