name: Pins

on:
  schedule:
    - cron: "0 9 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-prerelease
  cancel-in-progress: false

jobs:
  pins:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/tools
      - name: Update appimagetool and prepare prerelease
        id: prepare
        run: '"$SHINPI_TOOLS" prepare pins'
      - uses: ./.github/actions/setup
        if: steps.prepare.outputs.ready == 'true'
        with:
          cache: appimage
          flatpak: prerelease
      - name: Check source
        if: steps.prepare.outputs.ready == 'true'
        run: sh packaging/check.sh
      - name: Import the Flatpak signing key
        if: steps.prepare.outputs.ready == 'true'
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: sh packaging/flatpak/prepare.sh prerelease
      - name: Build and check distribution packages
        if: steps.prepare.outputs.ready == 'true'
        run: |
          sh packaging/release/build.sh prerelease
      - name: Publish pin prerelease
        if: steps.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
          OLD_DEPS: ${{ steps.prepare.outputs.old_deps }}
        run: target/debug/shinpi-tools publish pins "$VERSION" "$OLD_DEPS"
